name: CI

"on":
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "ideas/**"

permissions:
  contents: read

jobs:
  # ── Path filter ──────────────────────────────────────────────────────
  # Determine whether the full build is needed. Docs-only PRs skip it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**'
              - '!docs/**'
              - '!site/**'
              - '!*.md'
              - '!mkdocs.yml'
              - '!requirements-docs.txt'
              - '!ideas/**'

  build:
    needs: changes
    if: needs.changes.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Check testing ↔ shared-types sync
        run: pnpm run check:sync

      - name: Validate error catalog
        run: node tools/generate-error-catalog.mjs --check

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/coverage-summary.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build test-park game
        run: pnpm run build:test-park

      - name: Build obby game
        run: pnpm run build:obby

  # ── Gate job ─────────────────────────────────────────────────────────
  # Always runs. Succeeds if build was skipped (docs-only) or passed.
  # Set this as the required status check in branch protection.
  ci-ok:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.build.result }}" == "cancelled" ]]; then
            echo "Build failed or was cancelled"
            exit 1
          fi
          echo "CI passed (build: ${{ needs.build.result }})"
