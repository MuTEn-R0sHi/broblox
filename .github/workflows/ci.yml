name: CI

"on":
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "ideas/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Check testing ↔ shared-types sync
        run: pnpm run check:sync

      - name: Validate error catalog
        run: node tools/generate-error-catalog.mjs --check

      - name: Test with coverage
        run: pnpm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-summary.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build test-park game
        run: pnpm run build:test-park

      - name: Build obby game
        run: pnpm run build:obby
