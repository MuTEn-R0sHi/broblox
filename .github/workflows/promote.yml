name: Promote

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game to promote"
        required: true
        type: choice
        options:
          - test-park
          - obby
        default: test-park
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      source_ref:
        description: "Git ref to promote (commit SHA or tag)"
        required: true
        type: string
      reason:
        description: "Reason for promotion"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-production:
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Verify tag exists
        run: |
          if [[ ! "${{ inputs.source_ref }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Production requires a version tag (e.g., v1.0.0)"
            echo "Received: ${{ inputs.source_ref }}"
            exit 1
          fi
          echo "✅ Valid version tag: ${{ inputs.source_ref }}"

  promote:
    needs: [validate-production]
    if: always() && (inputs.environment == 'staging' || needs.validate-production.result == 'success')
    uses: ./.github/workflows/build-and-publish.yml
    with:
      game: ${{ inputs.game }}
      source_ref: ${{ inputs.source_ref }}
      environment: ${{ inputs.environment }}
      reason: ${{ inputs.reason }}
    secrets:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}

  update-release:
    needs: [promote]
    if: inputs.environment == 'production' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Update GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = '${{ inputs.source_ref }}';
            const game = '${{ inputs.game }}';
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const release = releases.data.find(r => r.tag_name === tag);
            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: release.body + `\n\n---\n✅ **${game} Deployed to Production** by @${{ github.actor }} on ${new Date().toISOString()}\nReason: ${{ inputs.reason }}`
              });
            }
