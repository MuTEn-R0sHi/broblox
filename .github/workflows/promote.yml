name: Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      source_ref:
        description: "Git ref to promote (commit SHA or tag)"
        required: true
        type: string
      reason:
        description: "Reason for promotion"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote-staging:
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Log promotion details
        run: |
          echo "📋 Promotion Details"
          echo "==================="
          echo "Source: ${{ inputs.source_ref }}"
          echo "Target: staging"
          echo "Reason: ${{ inputs.reason }}"
          echo "Requested by: ${{ github.actor }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build starter game
        run: pnpm run build:starter

      - name: Setup Aftman (Rojo)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Build .rbxl with Rojo
        run: |
          cd games/starter
          rojo build default.project.json -o build.rbxl

      - name: Install rbxcloud CLI
        run: |
          curl -L https://github.com/Sleitnick/rbxcloud/releases/latest/download/rbxcloud-0.17.0-linux.zip -o rbxcloud.zip
          unzip rbxcloud.zip
          chmod +x rbxcloud
          sudo mv rbxcloud /usr/local/bin/

      - name: Publish to Staging
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: ${{ vars.STAGING_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.STAGING_PLACE_ID }}
        run: |
          echo "Publishing to Staging environment..."
          echo "Universe: $UNIVERSE_ID, Place: $PLACE_ID"

          rbxcloud experience publish \
            --api-key "$ROBLOX_OPEN_CLOUD_API_KEY" \
            --universe-id "$UNIVERSE_ID" \
            --place-id "$PLACE_ID" \
            --version-type published \
            --filename games/starter/build.rbxl

      - name: Create promotion record
        run: |
          echo "✅ Promotion Record"
          echo "==================="
          echo "Source: ${{ inputs.source_ref }}"
          echo "Target: staging"
          echo "Reason: ${{ inputs.reason }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  promote-production:
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-tags: true

      - name: Verify tag exists
        run: |
          # For production, we require a version tag
          if [[ ! "${{ inputs.source_ref }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Production requires a version tag (e.g., v1.0.0)"
            echo "Received: ${{ inputs.source_ref }}"
            exit 1
          fi
          echo "✅ Valid version tag: ${{ inputs.source_ref }}"

      - name: Log promotion details
        run: |
          echo "📋 Production Promotion Details"
          echo "==============================="
          echo "Version: ${{ inputs.source_ref }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Requested by: ${{ github.actor }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build starter game
        run: pnpm run build:starter

      - name: Setup Aftman (Rojo)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Build .rbxl with Rojo
        run: |
          cd games/starter
          rojo build default.project.json -o build.rbxl

      - name: Install rbxcloud CLI
        run: |
          curl -L https://github.com/Sleitnick/rbxcloud/releases/latest/download/rbxcloud-0.17.0-linux.zip -o rbxcloud.zip
          unzip rbxcloud.zip
          chmod +x rbxcloud
          sudo mv rbxcloud /usr/local/bin/

      - name: Publish to Production
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: ${{ vars.PROD_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.PROD_PLACE_ID }}
        run: |
          echo "🚀 Publishing to Production environment..."
          echo "Universe: $UNIVERSE_ID, Place: $PLACE_ID"

          rbxcloud experience publish \
            --api-key "$ROBLOX_OPEN_CLOUD_API_KEY" \
            --universe-id "$UNIVERSE_ID" \
            --place-id "$PLACE_ID" \
            --version-type published \
            --filename games/starter/build.rbxl

      - name: Create promotion record
        run: |
          echo "✅ Production Promotion Record"
          echo "=============================="
          echo "Version: ${{ inputs.source_ref }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Update GitHub Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ inputs.source_ref }}';
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const release = releases.data.find(r => r.tag_name === tag);
            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: release.body + `\n\n---\n✅ **Deployed to Production** by @${{ github.actor }} on ${new Date().toISOString()}\nReason: ${{ inputs.reason }}`
              });
            }
