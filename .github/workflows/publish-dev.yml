name: Publish Dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game:
        description: "Game to publish"
        required: true
        type: choice
        options:
          - starter
          - obby
        default: starter

concurrency:
  group: publish-dev-${{ inputs.game || 'starter' }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Set game variables
        id: game
        run: |
          GAME="${{ inputs.game || 'starter' }}"
          echo "name=$GAME" >> $GITHUB_OUTPUT

          if [ "$GAME" = "starter" ]; then
            echo "universe_id=${{ vars.STARTER_DEV_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
            echo "place_id=${{ vars.STARTER_DEV_PLACE_ID }}" >> $GITHUB_OUTPUT
            echo "build_cmd=pnpm run build:starter" >> $GITHUB_OUTPUT
            echo "game_path=games/starter" >> $GITHUB_OUTPUT
          elif [ "$GAME" = "obby" ]; then
            echo "universe_id=${{ vars.OBBY_DEV_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
            echo "place_id=${{ vars.OBBY_DEV_PLACE_ID }}" >> $GITHUB_OUTPUT
            echo "build_cmd=pnpm --filter @rbx/game-obby run build" >> $GITHUB_OUTPUT
            echo "game_path=games/obby" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build game
        run: ${{ steps.game.outputs.build_cmd }}

      - name: Setup Aftman (Rojo)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Build .rbxl with Rojo
        run: |
          cd ${{ steps.game.outputs.game_path }}
          rojo build default.project.json -o build.rbxl

      - name: Install rbxcloud CLI
        run: |
          RBXCLOUD_URL=$(curl -s https://api.github.com/repos/Sleitnick/rbxcloud/releases/latest | grep -o 'https://[^"]*linux\.zip')
          curl -L "$RBXCLOUD_URL" -o rbxcloud.zip
          unzip rbxcloud.zip
          chmod +x rbxcloud
          sudo mv rbxcloud /usr/local/bin/

      - name: Publish to Dev
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: ${{ steps.game.outputs.universe_id }}
          PLACE_ID: ${{ steps.game.outputs.place_id }}
        run: |
          echo "Publishing ${{ steps.game.outputs.name }} to Dev environment..."
          echo "Universe: $UNIVERSE_ID, Place: $PLACE_ID"

          rbxcloud experience publish \
            --api-key "$ROBLOX_OPEN_CLOUD_API_KEY" \
            --universe-id "$UNIVERSE_ID" \
            --place-id "$PLACE_ID" \
            --version-type published \
            --filename ${{ steps.game.outputs.game_path }}/build.rbxl

      - name: Post publish notification
        if: success()
        run: |
          echo "✅ Published ${{ steps.game.outputs.name }} to Dev"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
