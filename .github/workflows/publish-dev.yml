name: Publish Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-dev
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build starter game
        run: pnpm run build:starter

      - name: Setup Aftman (Rojo)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Build .rbxl with Rojo
        run: |
          cd games/starter
          rojo build default.project.json -o build.rbxl

      - name: Install Roblox CLI tools
        run: |
          curl -L https://github.com/Roblox/rbxcloud/releases/latest/download/rbxcloud-linux-x86_64.tar.gz | tar xz
          chmod +x rbxcloud
          sudo mv rbxcloud /usr/local/bin/

      - name: Publish to Dev
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: ${{ vars.DEV_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.DEV_PLACE_ID }}
        run: |
          echo "Publishing to Dev environment..."
          echo "Universe: $UNIVERSE_ID, Place: $PLACE_ID"

          rbxcloud experience publish \
            --api-key "$ROBLOX_OPEN_CLOUD_API_KEY" \
            --universe-id "$UNIVERSE_ID" \
            --place-id "$PLACE_ID" \
            --version-type "Published" \
            --filename games/starter/build.rbxl

      - name: Post publish notification
        if: success()
        run: |
          echo "✅ Published to Dev"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
