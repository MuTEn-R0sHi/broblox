name: Publish Dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game:
        description: "Game to publish (all = both games)"
        required: true
        type: choice
        options:
          - all
          - test-park
          - obby
        default: all

permissions:
  contents: read

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.set.outputs.games }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.game }}" = "all" ]; then
            echo 'games=["test-park","obby"]' >> $GITHUB_OUTPUT
          else
            echo 'games=["${{ inputs.game }}"]' >> $GITHUB_OUTPUT
          fi

  build-and-publish:
    needs: set-matrix
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.set-matrix.outputs.games) }}
    concurrency:
      group: publish-dev-${{ matrix.game }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Set game variables
        id: game
        run: |
          GAME="${{ matrix.game }}"
          echo "name=$GAME" >> $GITHUB_OUTPUT

          if [ "$GAME" = "test-park" ]; then
            echo "universe_id=${{ vars.TEST_PARK_DEV_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
            echo "place_id=${{ vars.TEST_PARK_DEV_PLACE_ID }}" >> $GITHUB_OUTPUT
            echo "game_path=games/test-park" >> $GITHUB_OUTPUT
          elif [ "$GAME" = "obby" ]; then
            echo "universe_id=${{ vars.OBBY_DEV_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
            echo "place_id=${{ vars.OBBY_DEV_PLACE_ID }}" >> $GITHUB_OUTPUT
            echo "game_path=games/obby" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build game
        run: pnpm --filter @broblox/game-${{ matrix.game }} run build

      - name: Setup Aftman (Rojo)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Build .rbxl with Rojo
        run: |
          cd ${{ steps.game.outputs.game_path }}
          rojo build default.project.json -o build.rbxl

      - name: Install rbxcloud CLI
        run: |
          RBXCLOUD_URL=$(curl -s https://api.github.com/repos/Sleitnick/rbxcloud/releases/latest | grep -o 'https://[^"]*linux\.zip')
          curl -L "$RBXCLOUD_URL" -o rbxcloud.zip
          unzip rbxcloud.zip
          chmod +x rbxcloud
          sudo mv rbxcloud /usr/local/bin/

      - name: Publish to Dev
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: ${{ steps.game.outputs.universe_id }}
          PLACE_ID: ${{ steps.game.outputs.place_id }}
        run: |
          echo "Publishing ${{ matrix.game }} to Dev environment..."
          echo "Universe: $UNIVERSE_ID, Place: $PLACE_ID"

          MAX_RETRIES=5
          DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            OUTPUT=$(rbxcloud experience publish \
              --api-key "$ROBLOX_OPEN_CLOUD_API_KEY" \
              --universe-id "$UNIVERSE_ID" \
              --place-id "$PLACE_ID" \
              --version-type published \
              --filename ${{ steps.game.outputs.game_path }}/build.rbxl 2>&1) && {
              echo "$OUTPUT"
              echo "✅ Publish succeeded on attempt $i"
              exit 0
            }
            echo "$OUTPUT"
            # Only retry on 409 (server busy) — fail fast on other errors
            if ! echo "$OUTPUT" | grep -qi "409\|server is busy"; then
              echo "❌ Non-retryable error, failing immediately"
              exit 1
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "⏳ Server busy (409), retrying in ${DELAY}s..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
            fi
          done
          echo "❌ Publish failed after $MAX_RETRIES attempts (server busy)"
          exit 1

      - name: Post publish notification
        if: success()
        run: |
          echo "✅ Published ${{ matrix.game }} to Dev"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
