name: Docs (lima-city deploy)

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-limacity
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build

      - name: Deploy via lftp (SFTP/FTPS)
        env:
          LIMACITY_HOST: ${{ secrets.LIMACITY_HOST }}
          LIMACITY_PORT: ${{ secrets.LIMACITY_PORT }}
          LIMACITY_USER: ${{ secrets.LIMACITY_USER }}
          LIMACITY_PASS: ${{ secrets.LIMACITY_PASS }}
          LIMACITY_PROTOCOL: ${{ secrets.LIMACITY_PROTOCOL }}
          LIMACITY_REMOTE_DIR: ${{ secrets.LIMACITY_REMOTE_DIR }}
        run: |
          if [ -z "$LIMACITY_HOST" ] || [ -z "$LIMACITY_USER" ] || [ -z "$LIMACITY_PASS" ] || [ -z "$LIMACITY_REMOTE_DIR" ]; then
            echo "Missing one or more required secrets: LIMACITY_HOST, LIMACITY_USER, LIMACITY_PASS, LIMACITY_REMOTE_DIR"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y lftp

          protocol="${LIMACITY_PROTOCOL:-sftp}"
          port="${LIMACITY_PORT:-}"
          remote_dir="${LIMACITY_REMOTE_DIR%/}"

          # Connection options
          # - For FTPS, enforce TLS and (by default) skip cert verification because CI runners
          #   don't have the host cert pinned. If you want strict verification, we can add a
          #   known-ca / fingerprint pin step later.
          base_settings="set net:max-retries 2; set net:timeout 20; set net:reconnect-interval-base 2;"

          scheme="$protocol"

          if [ "$protocol" = "ftps" ]; then
            # lima-city uses explicit FTPS on port 21.
            # In lftp, use the ftp:// scheme + enable TLS via settings.
            scheme="ftp"
            proto_settings="set ftp:ssl-force true; set ftp:ssl-auth TLS; set ftp:ssl-protect-data true; set ftp:ssl-protect-list true; set ftp:passive-mode true; set ssl:verify-certificate no;"
          elif [ "$protocol" = "ftp" ]; then
            # Plain FTP (not recommended). Keep passive mode for compatibility.
            proto_settings="set ftp:passive-mode true;"
          else
            # sftp
            proto_settings="set sftp:auto-confirm yes;"
          fi

          if [ -n "$port" ]; then
            host_url="$scheme://$LIMACITY_HOST:$port"
          else
            host_url="$scheme://$LIMACITY_HOST"
          fi

          # Mirror local site/ -> remote dir (delete removed files, keep remote in sync)
          # --parallel=10: Upload 10 files simultaneously (significant speedup)
          # --use-pget-n=1: Disable segmented downloads (not needed for upload)
          lftp -e "$base_settings $proto_settings mirror -R --delete --verbose --parallel=10 site/ \"$remote_dir\"; bye" \
            -u "$LIMACITY_USER","$LIMACITY_PASS" \
            "$host_url"
