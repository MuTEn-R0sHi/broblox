name: Build and Publish Game

on:
  workflow_call:
    inputs:
      game:
        description: "Game to build and publish"
        required: true
        type: string
      source_ref:
        description: "Git ref to build from"
        required: true
        type: string
      environment:
        description: "Target environment (staging or production)"
        required: true
        type: string
      reason:
        description: "Reason for promotion"
        required: true
        type: string
    secrets:
      ROBLOX_OPEN_CLOUD_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-tags: true

      - name: Set game variables
        id: game
        run: |
          GAME="${{ inputs.game }}"
          echo "name=$GAME" >> $GITHUB_OUTPUT
          ENV="${{ inputs.environment }}"

          if [ "$GAME" = "test-park" ]; then
            if [ "$ENV" = "staging" ]; then
              echo "universe_id=${{ vars.TEST_PARK_STAGING_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
              echo "place_id=${{ vars.TEST_PARK_STAGING_PLACE_ID }}" >> $GITHUB_OUTPUT
            else
              echo "universe_id=${{ vars.TEST_PARK_PROD_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
              echo "place_id=${{ vars.TEST_PARK_PROD_PLACE_ID }}" >> $GITHUB_OUTPUT
            fi
            echo "game_path=games/test-park" >> $GITHUB_OUTPUT
          elif [ "$GAME" = "obby" ]; then
            if [ "$ENV" = "staging" ]; then
              echo "universe_id=${{ vars.OBBY_STAGING_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
              echo "place_id=${{ vars.OBBY_STAGING_PLACE_ID }}" >> $GITHUB_OUTPUT
            else
              echo "universe_id=${{ vars.OBBY_PROD_UNIVERSE_ID }}" >> $GITHUB_OUTPUT
              echo "place_id=${{ vars.OBBY_PROD_PLACE_ID }}" >> $GITHUB_OUTPUT
            fi
            echo "game_path=games/obby" >> $GITHUB_OUTPUT
          fi

      - name: Log promotion details
        run: |
          echo "📋 Promotion Details"
          echo "==================="
          echo "Game: ${{ inputs.game }}"
          echo "Source: ${{ inputs.source_ref }}"
          echo "Target: ${{ inputs.environment }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Requested by: ${{ github.actor }}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build game
        run: pnpm --filter @broblox/game-${{ inputs.game }} run build

      - name: Setup Aftman (Rojo)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Build .rbxl with Rojo
        run: |
          cd ${{ steps.game.outputs.game_path }}
          rojo build default.project.json -o build.rbxl

      - name: Upload .rbxl artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game }}-${{ inputs.environment }}-${{ inputs.source_ref }}
          path: ${{ steps.game.outputs.game_path }}/build.rbxl
          retention-days: 90

      - name: Install rbxcloud CLI
        run: |
          RBXCLOUD_URL=$(curl -s https://api.github.com/repos/Sleitnick/rbxcloud/releases/latest | grep -o 'https://[^"]*linux\.zip')
          curl -L "$RBXCLOUD_URL" -o rbxcloud.zip
          unzip rbxcloud.zip
          chmod +x rbxcloud
          sudo mv rbxcloud /usr/local/bin/

      - name: Publish to ${{ inputs.environment }}
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: ${{ steps.game.outputs.universe_id }}
          PLACE_ID: ${{ steps.game.outputs.place_id }}
        run: |
          echo "Publishing ${{ steps.game.outputs.name }} to ${{ inputs.environment }}..."
          echo "Universe: $UNIVERSE_ID, Place: $PLACE_ID"

          rbxcloud experience publish \
            --api-key "$ROBLOX_OPEN_CLOUD_API_KEY" \
            --universe-id "$UNIVERSE_ID" \
            --place-id "$PLACE_ID" \
            --version-type published \
            --filename ${{ steps.game.outputs.game_path }}/build.rbxl

      - name: Create promotion record
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "✅ Promotion Record"
          echo "==================="
          echo "Game: ${{ inputs.game }}"
          echo "Source: ${{ inputs.source_ref }}"
          echo "Target: ${{ inputs.environment }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $TIMESTAMP"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            if [ "${{ inputs.environment }}" = "production" ]; then
              COLOR=15158332  # red
              TITLE="🚀 Deployed to Production"
            else
              COLOR=16776960  # yellow
              TITLE="📦 Deployed to Staging"
            fi

            EMBED_JSON=$(cat <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "color": $COLOR,
              "fields": [
                { "name": "Game", "value": "${{ inputs.game }}", "inline": true },
                { "name": "Environment", "value": "${{ inputs.environment }}", "inline": true },
                { "name": "Actor", "value": "${{ github.actor }}", "inline": true },
                { "name": "Source", "value": "\`${{ inputs.source_ref }}\`", "inline": true },
                { "name": "Reason", "value": "${{ inputs.reason }}" }
              ],
              "timestamp": "$TIMESTAMP"
            }]
          }
          EOF
            )
            curl -sf -H "Content-Type: application/json" -d "$EMBED_JSON" "$DISCORD_WEBHOOK_URL" || echo "⚠️ Discord notification failed (non-fatal)"
          fi
